plugins {
    id('com.android.library')
}

android {
    namespace = "rikka.hidden.stub"
    buildFeatures {
        buildConfig false
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    // Java 8 like upstream: with source >= 9 javac refuses stub classes in
    // packages such as dalvik.system ("package exists in another module")
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    annotationProcessor libs.refine.annotation.processor
    implementation libs.refine.annotation

    compileOnly "androidx.annotation:annotation:1.3.0"
}


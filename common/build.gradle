plugins {
    id 'com.android.library'
}

android {
    namespace 'rikka.shizuku.common'
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        // Single source of truth for the manager package name (branding.properties),
        // used by the server, the user-service starter and rish.
        buildConfigField 'String', 'MANAGER_APPLICATION_ID', "\"${rootProject.ext.branding.applicationId}\""
    }
}

dependencies {
    compileOnly project(':hidden-stub')
}

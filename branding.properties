# ---------------------------------------------------------------------------
# Fork branding: the only file you need to edit to rename the app.
# After changing it, run a clean build (./gradlew clean :manager:assembleRelease).
# See docs/RENAMING.md for details.
# ---------------------------------------------------------------------------

# Name on the launcher and in the UI. Every "Shizuku" in the manager's
# string resources (all languages) is replaced by this at build time.
app.name=Shizuqu

# Android application id (package name).
#
#   moe.shizuku.privileged.api  -> drop-in replacement for Shizuku. Apps that
#       look for Shizuku by package name (to open it, or to check that it is
#       installed) keep working. Uninstall the original Shizuku first.
#       Upstream's license forbids publishing an APK with this id, the name
#       "Shizuku" or the moe.shizuku.manager.permission.* permissions to app
#       stores (Google Play, F-Droid, ...). Fine for GitHub releases / own use.
#
#   anything else (e.g. io.github.yourname.shizuqu) -> can be installed next
#       to the original Shizuku. Binder delivery and permissions still work for
#       every app using the Shizuku API, but apps that hard-code the
#       Shizuku package name will not find this app.
app.applicationId=moe.shizuku.privileged.api

# Base of the APK file name: <app.fileName>-v<version>-<buildType>.apk
app.fileName=shizuqu

# Shown in the About dialog as "source code".
app.sourceUrl=https://github.com/bugragungoz/shizuqu

# Version shown to users. The build adds .r<commit count>.<commit hash>.
app.versionBase=13.7.0

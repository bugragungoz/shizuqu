name: App

on:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode = commit count, so the full history is needed
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Write signing config
        # Release APKs are signed with signing/release.p12 when the
        # KEYSTORE_PASSWORD secret is set (see signing/README.md). A different
        # key can be supplied as the base64 KEYSTORE secret (+ alias secrets).
        # Without secrets, release APKs get a throw-away debug signature.
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::KEYSTORE_PASSWORD secret is not set, release APKs are signed with a debug key"
            exit 0
          fi
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > key.jks
            file=../key.jks
          else
            file=../signing/release.p12
          fi
          {
            echo "KEYSTORE_FILE=$file"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEYSTORE_ALIAS=${KEYSTORE_ALIAS:-release}"
            echo "KEYSTORE_ALIAS_PASSWORD=${KEYSTORE_ALIAS_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > signing.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null

      - name: Build
        id: build
        run: |
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          ./gradlew :manager:assemble
          apk=$(ls manager/build/outputs/apk/release/*-release.apk | head -n1)
          name=$(basename "$apk" -release.apk)
          echo "releaseName=$name" >> "$GITHUB_OUTPUT"
          echo "releaseApk=$apk" >> "$GITHUB_OUTPUT"

      - name: Check branding
        # The launcher label must be app.name from branding.properties and no
        # "Shizuku" may be left in the manager's strings.
        run: |
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          apk="${{ steps.build.outputs.releaseApk }}"
          name=$(grep '^app.name=' branding.properties | cut -d= -f2-)
          label=$("$aapt2" dump badging "$apk" | sed -n "s/^application-label:'\(.*\)'$/\1/p")
          echo "label: $label (expected: $name)"
          [ "$label" = "$name" ]
          if "$aapt2" dump strings "$apk" | grep -q 'Shizuku'; then
            echo "::error::\"Shizuku\" found in the APK's string resources"; exit 1
          fi

      - name: Check hidden API linkage against Android 17
        # Fails if the APK calls a framework method that does not exist on
        # Android 17.0 / 17.1 and is not in the reviewed allow-list.
        run: |
          for sigs in tools/hiddenapi-check/frameworks/*.sigs.gz; do
            python3 tools/hiddenapi-check/check.py check "${{ steps.build.outputs.releaseApk }}" "$sigs" \
              --only android/,com/android/ \
              --allow tools/hiddenapi-check/allowlist.txt
          done

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.releaseName }}
          path: |
            manager/build/outputs/apk
            manager/build/outputs/mapping
          compression-level: 9

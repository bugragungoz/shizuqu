// Screenshot tests render real layouts with layoutlib (no device):
//   ./gradlew :manager:recordPaparazziDebug -Pscreenshots
// They are opt-in so the normal build does not depend on layoutlib.
if (project.hasProperty('screenshots')) {
    apply plugin: 'app.cash.paparazzi'
    // layoutlib's instrumented framework classes fail bytecode verification on JDK 21
    tasks.withType(Test).configureEach {
        jvmArgs '-Xverify:none'
    }
    // Paparazzi only reads source-set resource folders; add the themes generated by
    // materialThemeBuilder, or every theme that inherits from them resolves to nothing
    tasks.matching { it.name.startsWith('preparePaparazzi') && it.name.endsWith('Resources') }.configureEach { task ->
        def variant = task.name.replace('preparePaparazzi', '').replace('Resources', '').uncapitalize()
        task.dependsOn("generate${variant.capitalize()}MaterialThemeBuilderRes")
        task.doLast {
            def json = file("${buildDir}/intermediates/paparazzi/${variant}/resources.json")
            def config = new groovy.json.JsonSlurper().parse(json)
            def dir = "build/generated/materialThemeBuilder/${variant}/res"
            if (!config.projectResourceDirs.contains(dir)) config.projectResourceDirs.add(1, dir)
            json.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
        }
    }
}


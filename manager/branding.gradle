// ---------------------------------------------------------------------------
// Branding: every "Shizuku" in the manager's string resources (all languages)
// is replaced by branding.app.name (see /branding.properties).
//
// The rewritten files go to an overlay directory used by the debug and release
// source sets, so src/main/res stays identical to upstream and upstream
// translation updates still merge cleanly. The overlay is regenerated on every
// Gradle configuration, so editing branding.properties is enough.
// ---------------------------------------------------------------------------

def brandedResDir = new File(buildDir, 'generated/branding/res')

def generateBrandedResources = {
    def appName = rootProject.ext.branding.appName
    def escaped = appName.replace('&', '&amp;').replace('<', '&lt;').replace("'", "\\'")
    def written = [] as Set

    file('src/main/res').eachDirMatch(~/values.*/) { dir ->
        dir.eachFileMatch(~/strings.*\.xml/) { xml ->
            def text = xml.getText('UTF-8')
            if (!text.contains('Shizuku')) return

            // No resource *name* in these files contains "Shizuku" (checked by the
            // assertion below), so a plain replace only touches user-visible text.
            if (text =~ /name="[^"]*Shizuku/) {
                throw new GradleException("${xml}: a resource name contains 'Shizuku', update manager/branding.gradle")
            }
            def body = text.replace('Shizuku', escaped)
            def notice = "<!-- Generated by manager/branding.gradle from src/main/res/${dir.name}/${xml.name}. Do not edit. -->"
            def branded
            if (body.startsWith('<?xml')) {
                // the XML declaration must stay first
                int end = body.indexOf('?>') + 2
                branded = body.substring(0, end) + '\n' + notice + body.substring(end)
            } else {
                branded = notice + '\n' + body
            }

            def out = new File(brandedResDir, "${dir.name}/${xml.name}")
            out.parentFile.mkdirs()
            if (!out.exists() || out.getText('UTF-8') != branded) {
                out.setText(branded, 'UTF-8')
            }
            written << out.canonicalPath
        }
    }

    // remove stale files, e.g. a strings file that no longer mentions Shizuku
    if (brandedResDir.exists()) {
        brandedResDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!written.contains(f.canonicalPath)) f.delete()
        }
    }
}

generateBrandedResources()

android.sourceSets.debug.res.srcDirs += brandedResDir
android.sourceSets.release.res.srcDirs += brandedResDir
